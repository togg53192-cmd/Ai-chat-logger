<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>AI Chat Logger</title>
    <link rel="stylesheet" href="viewer.css" />
  </head>
  <body>
    <header class="toolbar">
      <h1>AI Chat Logger</h1>
      <div class="actions">
        <label class="auto-scroll">
          <input id="auto-scroll" type="checkbox" checked />
          <span>Auto-scroll</span>
        </label>
        <label class="auto-scroll">
          <input id="show-raw" type="checkbox" />
          <span>Show raw stream</span>
        </label>
        <button id="export" type="button">Export JSON</button>
        <button id="clear" type="button" class="danger">Clear</button>
      </div>
    </header>
    <main id="log" class="log" aria-live="polite"></main>
    <aside id="raw" class="raw" hidden>
      <h2>Raw network stream</h2>
      <pre id="raw-content"></pre>
    </aside>
    <footer class="status">
      <span id="status">Waiting for messages…</span>
    </footer>
    <script src="viewer.js"></script>
  </body>
</html>
